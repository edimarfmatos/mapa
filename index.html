<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuluka - Sistema de IA</title>
    <style>
        /* Estilos Gerais e Temáticos (Futurista/Dark) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* CARD PRINCIPAL */
        .container {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            width: 400px;
            height: 600px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 1. TELA DE LOGIN (CHAVE API) */
        #tela-login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        #tela-login h3 {
            font-size: 1.2rem;
            color: #3b82f6;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .input-estilizado {
            width: 100%;
            padding: 12px 16px;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(75, 85, 99, 0.5);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .input-estilizado:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }

        .botao-estilizado {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .botao-estilizado:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        .botao-estilizado:active {
            transform: scale(0.98);
        }

        /* 2. TELA DO CHAT (FULUKA) */
        #tela-chat {
            display: none; /* Começa escondida */
            flex-direction: column;
            height: 100%;
        }

        /* Órbita Visual da Fuluka */
        .painel-orbita {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 10px;
        }

        .orbita {
            width: 70px;
            height: 70px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: rodar 2s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nucleo-orbita {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #3b82f6, #1d4ed8);
            border-radius: 50%;
            box-shadow: 0 0 15px #3b82f6;
            animation: pulsar 1.5s ease-in-out infinite alternate;
        }

        @keyframes rodar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulsar {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Área das Mensagens */
        #historico-chat {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Estilo dos Balões */
        .mensagem {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .mensagem.usuario {
            background-color: #2563eb;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .mensagem.fuluka {
            background-color: #1f2937;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Rodapé de Entrada de Texto */
        .painel-input {
            display: flex;
            gap: 8px;
        }

        .painel-input input {
            flex: 1;
            margin-bottom: 0;
        }

        .painel-input button {
            width: auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="tela-login">
            <h3>Identifique-se, por favor</h3>
            <input type="password" id="chave-api" class="input-estilizado" placeholder="Cole sua chave Gemini API aqui...">
            <button onclick="conectarSistema()" class="botao-estilizado">Acessar Sistema</button>
        </div>

        <div id="tela-chat">
            <div class="painel-orbita">
                <div class="orbita">
                    <div class="nucleo-orbita"></div>
                </div>
            </div>

            <div id="historico-chat">
                <div class="mensagem fuluka">Matriz quântica online. Como posso ajudar você hoje?</div>
            </div>

            <div class="painel-input">
                <input type="text" id="mensagem-usuario" class="input-estilizado" placeholder="Fale com a Fuluka..." onkeydown="verificarTecla(event)">
                <button onclick="enviarMensagem()" class="botao-estilizado">➔</button>
            </div>
        </div>

    </div>

    <script>
        // Variável global que guardará a chave apenas na memória do navegador
        let apiKey = "";

        // Função que valida a entrada da chave e altera as telas
        function conectarSistema() {
            const campoChave = document.getElementById("chave-api").value.trim();

            if (campoChave === "") {
                alert("Por favor, insira a sua chave de acesso para ativar a Fuluka.");
                return;
            }

            // Armazena temporariamente na variável de memória
            apiKey = campoChave;

            // Transição visual de telas
            document.getElementById("tela-login").style.display = "none";
            document.getElementById("tela-chat").style.display = "flex";
        }

        // Detecta o botão Enter no campo de mensagem para facilitar o envio
        function verificarTecla(event) {
            if (event.key === "Enter") {
                enviarMensagem();
            }
        }

        // Função responsável por processar e enviar a mensagem para a API do Gemini
        async function enviarMensagem() {
            const inputMensagem = document.getElementById("mensagem-usuario");
            const textoMensagem = inputMensagem.value.trim();
            const historico = document.getElementById("historico-chat");

            if (textoMensagem === "") return;

            // 1. Adiciona a mensagem do Usuário na tela
            const divUsuario = document.createElement("div");
            divUsuario.className = "mensagem usuario";
            divUsuario.textContent = textoMensagem;
            historico.appendChild(divUsuario);

            // Limpa o campo de texto e rola para baixo
            inputMensagem.value = "";
            historico.scrollTop = historico.scrollHeight;

            // 2. Cria o balão de resposta temporária da Fuluka (Carregando...)
            const divFuluka = document.createElement("div");
            divFuluka.className = "mensagem fuluka";
            divFuluka.textContent = "Processando dados...";
            historico.appendChild(divFuluka);
            historico.scrollTop = historico.scrollHeight;

            // 3. Conexão real com a API do Gemini utilizando a chave fornecida na senha
            // Modelo atualizado para a versão gemini-1.5-flash
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            const dadosRequisicao = {
                contents: [{
                    parts: [{ text: textoMensagem }]
                }]
            };

            try {
                const resposta = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dadosRequisicao)
                });

                if (!resposta.ok) {
                    throw new Error("Falha na comunicação com o servidor.");
                }

                const dadosRetornados = await resposta.json();
                
                // Extrai o texto da resposta do JSON do Gemini
                const respostaTexto = dadosRetornados.candidates[0].content.parts[0].text;
                
                // Atualiza o balão da Fuluka com a resposta real
                divFuluka.textContent = respostaTexto;

            } catch (error) {
                console.error(error);
                divFuluka.textContent = "Erro crítico de conexão: Verifique se sua chave de acesso está correta ou se o limite foi atingido.";
                divFuluka.style.borderColor = "#ef4444"; // Borda vermelha indicando erro
            }

            // Garante que o scroll acompanhe o final da resposta
            historico.scrollTop = historico.scrollHeight;
        }
    </script>
</body>
</html>
